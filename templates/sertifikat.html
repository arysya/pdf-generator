<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Сертификат № {{ invoice_id }}</title>
<style>
  @page { size: A5 landscape; margin: 0; }
  body { margin: 0; color: #23302c; }
  .card { box-sizing: border-box; height: 148mm; padding: 14mm 18mm;
          background: #eef3f1; border: 6mm solid #5d7d72; position: relative; }
  .salon { font-size: 10pt; letter-spacing: 3pt; text-transform: uppercase; color: #5d7d72; }
  h1 { font-size: 30pt; font-weight: 600; margin: 8mm 0 2mm; color: #3e5f54; }
  .label { font-size: 8.5pt; color: #6b7a75; margin-top: 4mm; }
  .to { font-size: 15pt; margin-bottom: 1mm; }
  .from { font-size: 10pt; color: #6b7a75; min-height: 12pt; }
  .service { margin-top: 8mm; font-size: 12pt; max-width: 120mm; overflow-wrap: anywhere; }
  .amount { position: absolute; right: 18mm; bottom: 26mm; font-size: 26pt; font-weight: 600; color: #3e5f54; }
  .meta { position: absolute; left: 18mm; right: 18mm; bottom: 12mm; font-size: 8.5pt; color: #6b7a75;
          display: flex; justify-content: space-between; }
</style>
</head>
<body>
  <div class="card">
    <div class="salon">Тихая гавань, спа-студия</div>
    <h1>Подарочный сертификат</h1>
    <div class="label">Получатель</div>
    <div class="to">{{ recipient }}</div>
    <div class="from">{{ from_whom }}</div>
    <div class="service">{{ service }}</div>
    <div class="amount">{{ amount }} ₽</div>
    <div class="meta"><span>№ {{ invoice_id }}, выдан {{ date }}</span><span>действует до {{ valid_until }}</span></div>
  </div>
</body>
</html>
